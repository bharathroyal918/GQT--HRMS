      - password
    WorkArrangementEnum:
      enum:
      - ONSITE
      - HYBRID
      - REMOTE
      type: string
      description: |-
        * `ONSITE` - On-site / In-Office
        * `HYBRID` - Hybrid Model
        * `REMOTE` - Full Remote / Work from Home

openapi: 3.0.3
info:
  title: GQT HRMS & Recruitment CRM Platform API
  version: 1.0.0
  description: Production REST API for recruitment CRM, job verification, student
    eligibility, interviews, placements, and Student Portal integration.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticates staff credentials, issues SimpleJWT tokens, and sets
        secure HttpOnly cookies.
      summary: User Authentication & Cookie Issuance
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginInputRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Terminates session, blacklists refresh token, and purges HttpOnly
        authentication cookies.
      summary: User Session Invalidation & Logout
      tags:
      - auth
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccessResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Returns the profile and role assignments of the currently authenticated
        user.
      summary: Retrieve Current User Profile
      tags:
      - auth
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Refreshes access token via HttpOnly refresh cookie.
      summary: Silent Token Refresh
      tags:
      - auth
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshSuccessResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshErrorResponse'
          description: ''
  /api/v1/auth/users/:
    get:
      operationId: auth_users_list
      description: Administrative directory of staff accounts and staff creation gate.
      summary: List Staff Accounts
      tags:
      - auth
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfile'
          description: ''
    post:
      operationId: auth_users_create
      description: Administrative directory of staff accounts and staff creation gate.
      summary: Provision New Staff Account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProvisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProvisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProvisionRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/users/{user_id}/:
    get:
      operationId: auth_users_retrieve
      description: Administrative retrieval and status updates for a specific user.
      summary: Retrieve Staff Account Details
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundResponse'
          description: ''
    patch:
      operationId: auth_users_partial_update
      description: Administrative retrieval and status updates for a specific user.
      summary: Update Staff Account Active Status
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserStatusUpdateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserStatusUpdateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserStatusUpdateInputRequest'
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundResponsePatch'
          description: ''
  /api/v1/auth/users/{user_id}/roles/:
    post:
      operationId: auth_users_roles_create
      description: Assign or revoke an operational role for a user.
      summary: Assign Role to Staff Account
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleAssignmentInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleAssignmentInputRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundRoleAssign'
          description: ''
    delete:
      operationId: auth_users_roles_destroy
      description: Assign or revoke an operational role for a user.
      summary: Revoke Role from Staff Account
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotFoundRoleRevoke'
          description: ''
  /api/v1/creatives/metrics/:
    get:
      operationId: creatives_metrics_retrieve
      description: Creative Studio analytics and throughput KPI aggregations.
      summary: Creative Studio Analytics & Throughput Metrics
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeStudioMetricsResponse'
          description: ''
  /api/v1/creatives/queues/designer/:
    get:
      operationId: creatives_queues_designer_list
      description: Requisitions actively assigned to the authenticated designer.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreativeRequestListList'
          description: ''
  /api/v1/creatives/queues/handoff/:
    get:
      operationId: creatives_queues_handoff_list
      description: Approved requisitions ready for campus drive collateral distribution.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreativeRequestListList'
          description: ''
  /api/v1/creatives/queues/review/:
    get:
      operationId: creatives_queues_review_list
      description: Asset versions currently in review awaiting compliance evaluation.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreativeAssetVersionDetailList'
          description: ''
  /api/v1/creatives/queues/triage/:
    get:
      operationId: creatives_queues_triage_list
      description: Requisitions in SUBMITTED state awaiting designer assignment.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreativeRequestListList'
          description: ''
  /api/v1/creatives/requests/:
    get:
      operationId: creatives_requests_list
      description: Manage recruitment creative marketing requisitions.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreativeRequestListList'
          description: ''
    post:
      operationId: creatives_requests_create
      description: Manage recruitment creative marketing requisitions.
      tags:
      - creatives
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreativeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCreativeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCreativeRequestRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCreativeRequest'
          description: ''
  /api/v1/creatives/requests/{id}/:
    get:
      operationId: creatives_requests_retrieve
      description: Manage recruitment creative marketing requisitions.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Creative Requisition.
        required: true
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeRequestDetail'
          description: ''
    put:
      operationId: creatives_requests_update
      description: Manage recruitment creative marketing requisitions.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Creative Requisition.
        required: true
      tags:
      - creatives
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCreativeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateCreativeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateCreativeRequestRequest'
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCreativeRequest'
          description: ''
    patch:
      operationId: creatives_requests_partial_update
      description: Manage recruitment creative marketing requisitions.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Creative Requisition.
        required: true
      tags:
      - creatives
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCreativeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCreativeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCreativeRequestRequest'
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCreativeRequest'
          description: ''
    delete:
      operationId: creatives_requests_destroy
      description: Manage recruitment creative marketing requisitions.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Creative Requisition.
        required: true
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/creatives/requests/{id}/assign/:
    post:
      operationId: creatives_requests_assign_create
      description: Triage and assign requisition to a graphic designer.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Creative Requisition.
        required: true
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeRequestDetail'
          description: ''
  /api/v1/creatives/requests/{id}/cancel/:
    post:
      operationId: creatives_requests_cancel_create
      description: Cancel requisition with documented justification.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Creative Requisition.
        required: true
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeRequestDetail'
          description: ''
  /api/v1/creatives/requests/{id}/handoff/:
    post:
      operationId: creatives_requests_handoff_create
      description: Mark approved requisition ready for campus drive collateral.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Creative Requisition.
        required: true
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeRequestDetail'
          description: ''
  /api/v1/creatives/requests/{id}/submit/:
    post:
      operationId: creatives_requests_submit_create
      description: Submit draft requisition for design triage.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Creative Requisition.
        required: true
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeRequestDetail'
          description: ''
  /api/v1/creatives/requests/{id}/upload_version/:
    post:
      operationId: creatives_requests_upload_version_create
      description: Upload a new design asset deliverable version.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Creative Requisition.
        required: true
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeRequestDetail'
          description: ''
  /api/v1/creatives/versions/{id}/:
    get:
      operationId: creatives_versions_retrieve
      description: Manage asset version reviews, compliance checks, and secure downloads.
      summary: Retrieve Asset Version Detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Creative Asset Version.
        required: true
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeAssetVersionDetail'
          description: ''
  /api/v1/creatives/versions/{id}/approve/:
    post:
      operationId: creatives_versions_approve_create
      description: Authorize asset version. Enforces SoD and all 4 checks PASSED.
      summary: Approve Deliverable Asset Version
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Creative Asset Version.
        required: true
      tags:
      - creatives
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveVersionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApproveVersionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApproveVersionRequest'
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeAssetVersionDetail'
          description: ''
  /api/v1/creatives/versions/{id}/checks/{check_type}/:
    post:
      operationId: creatives_versions_checks_create
      description: Evaluate a specific compliance check (PASSED/FLAGGED).
      summary: Evaluate Design Compliance Check
      parameters:
      - in: path
        name: check_type
        schema:
          type: string
        description: Design compliance check type
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Creative Asset Version.
        required: true
      tags:
      - creatives
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateCheckRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EvaluateCheckRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvaluateCheckRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignComplianceCheck'
          description: ''
  /api/v1/creatives/versions/{id}/download/:
    get:
      operationId: creatives_versions_download_retrieve
      description: Stream validated asset file with nosniff and defensive headers.
      summary: Securely Download Asset Version File
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Creative Asset Version.
        required: true
      tags:
      - creatives
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/creatives/versions/{id}/request_changes/:
    post:
      operationId: creatives_versions_request_changes_create
      description: Request revisions from designer with required feedback.
      summary: Request Changes on Asset Version
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Creative Asset Version.
        required: true
      tags:
      - creatives
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestChangesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestChangesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestChangesRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeAssetVersionDetail'
          description: ''
  /api/v1/crm/companies/:
    get:
      operationId: crm_companies_list
      description: List hiring partner companies or create a new prospect company.
      summary: List Target Companies
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: string
        description: Filter by assigned executive UUID
      - in: query
        name: industry
        schema:
          type: string
        description: Filter by industry category
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search term matching name, website or domain
      - in: query
        name: source
        schema:
          type: string
        description: Filter by acquisition channel
      - in: query
        name: status
        schema:
          type: string
        description: Filter by company lifecycle status
      - in: query
        name: tier
        schema:
          type: string
        description: Filter by company tier
      tags:
      - crm
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyListList'
          description: ''
    post:
      operationId: crm_companies_create
      description: List hiring partner companies or create a new prospect company.
      summary: Create Target Company
      tags:
      - crm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyCreateRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/crm/companies/{company_id}/:
    get:
      operationId: crm_companies_retrieve
      description: Retrieve, update, or soft-delete a specific hiring partner company.
      summary: Get Company Detail
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - crm
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    patch:
      operationId: crm_companies_partial_update
      description: Retrieve, update, or soft-delete a specific hiring partner company.
      summary: Update Company
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
          format: uuid
        required: true

    UserProfile:
      type: object
      description: Serializer for user profile representation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Cryptographically random UUIDv4 primary key.
        email:
          type: string
          format: email
          description: Normalized email address used as the primary login identifier.
          maxLength: 255
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          maxLength: 20
        is_active:
          type: boolean
          description: Designates whether this user account is active and permitted
            to login.
        is_staff:
          type: boolean
          description: Designates whether the user can log into the Django admin site.
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        roles:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - full_name
      - id
      - is_superuser
      - roles
    UserProvisionRequest:
      type: object
      description: Input serializer for administrative staff creation.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 10
        first_name:
          type: string
          default: ''
        last_name:
          type: string
          default: ''
        phone_number:
          type: string
          default: ''
        roles:
          type: array
